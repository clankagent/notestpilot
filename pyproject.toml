[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notestpilot"
version = "0.2.0"
description = "Scripted Nuclear Option server simulation tests with native mock players"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notestpilot = "notestpilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notestpilot"]

[project]
name = "notestpilot"
version = "0.1.0"
description = "Repeatable Nuclear Option process and player tests"
requires-python = ">=3.11"

[project.scripts]
notestpilot = "notestpilot.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notestpilot"]
